write_tags:
  fields:
    entry_id:
      required: false
      example: 01J2Z3X4Y5
      selector:
        text:
    tags:
      required: true
      selector:
        object:

write_jobs:
  fields:
    entry_id:
      required: false
      selector:
        text:
    rows:
      required: true
      selector:
        object:

set_tag_price:
  fields:
    entry_id:
      required: false
      selector:
        text:
    serial:
      required: true
      example: 8CDFFF0100000100
      selector:
        text:
    price:
      required: true
      example: 13.22
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          mode: box

log_job:
  fields:
    entry_id:
      required: false
      selector:
        text:
    job:
      required: false
      selector:
        text:
    print_time_min:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: 0.1
          mode: box
    print_time:
      required: false
      selector:
        text:
    layers:
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    length_m:
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    nozzle_size:
      required: false
      selector:
        text:
    nozzle_type:
      required: false
      selector:
        text:
    filament_type:
      required: false
      selector:
        text:
    filament_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    power_cost:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    energy_kwh:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    capture_cover:
      required: false
      default: true
      selector:
        boolean:
    update_totals:
      required: false
      default: true
      selector:
        boolean:
    force:
      required: false
      default: false
      selector:
        boolean:

refresh:
  fields:
    entry_id:
      required: false
      selector:
        text:

import_legacy:
  fields:
    entry_id:
      required: false
      selector:
        text:
    tags_path:
      required: false
      example: /config/www/bambu_tags.csv
      selector:
        text:
    jobs_path:
      required: false
      example: /config/www/bambu_jobs_log.csv
      selector:
        text:
    covers_path:
      required: false
      example: /config/www/images/bambu_jobs
      selector:
        text:
    replace:
      required: false
      default: false
      selector:
        boolean:

sync_slot_prices:
  fields:
    entry_id:
      required: false
      selector:
        text:
